name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: depsim
            asset_name: depsim-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: depsim.exe
            asset_name: depsim-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: depsim
            asset_name: depsim-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: depsim
            asset_name: depsim-macos-arm64

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          body: |
            ## DEPSIM Release
            
            Registry-only npm dependency resolution preflight tool.
            
            ### Installation
            
            **Linux:**
            ```bash
            curl -L https://github.com/permaconomy/depsim/releases/latest/download/depsim-linux-x64 -o depsim
            chmod +x depsim
            sudo mv depsim /usr/local/bin/
            ```
            
            **macOS (Intel):**
            ```bash
            curl -L https://github.com/permaconomy/depsim/releases/latest/download/depsim-macos-x64 -o depsim
            chmod +x depsim
            sudo mv depsim /usr/local/bin/
            ```
            
            **macOS (Apple Silicon):**
            ```bash
            curl -L https://github.com/permaconomy/depsim/releases/latest/download/depsim-macos-arm64 -o depsim
            chmod +x depsim
            sudo mv depsim /usr/local/bin/
            ```
            
            **Windows:**
            Download `depsim-windows-x64.exe` and add to PATH.
            
            ### Usage
            ```bash
            depsim --help
            depsim path/to/package.json
            depsim --json > output.json
            ```
            
            ### Web Demo
            Try it online: https://permaconomy.github.io/depsim/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Made with Bob
