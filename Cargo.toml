[package]
name = "depsim"
version = "0.1.0"
edition = "2021"
authors = ["DEPSIM Contributors"]
description = "High-performance npm dependency resolution simulator built in Rust"
license = "MIT"
repository = "https://github.com/yourusername/depsim"
keywords = ["npm", "dependencies", "resolver", "package-manager"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "depsim"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "cargo"] }

# Terminal UI
colored = "2.1"
indicatif = "0.17"

# SAT solver - NOT REQUIRED FOR MVP (future milestone)
# splr = "0.17"

# Semver handling
semver = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Concurrent data structures
dashmap = "5.5"

# Async utilities
futures = "0.3"

# URL encoding for scoped packages
urlencoding = "2.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
mockito = "1.2"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"

